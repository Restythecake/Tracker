# Tracker: eine normale Compose-App, die zusätzlich Nest-Plugin ist.
#
#   docker compose up -d --build
#
# Nest erkennt den Container an den Labels von selbst; die Rechte stehen in
# nest.plugin.scopes und werden in Nest akzeptiert (Plugin-Einstellungen). Den
# Token holt sich der Tracker selbst per POST $NEST_PLUGIN_URL/claim -- nichts
# davon steht in der Umgebung. Die Website liegt hinter Caddy unter nest.app.url.
services:
  tracker:
    build: .
    image: nest-tracker:latest
    container_name: nest-tracker
    restart: unless-stopped
    labels:
      nest.plugin: "1"
      nest.plugin.id: arthur.tracker
      nest.plugin.scopes: "notify"
      nest.plugin.port: "8080"
      nest.app.url: https://tracker.mini.shibusa.moe
    environment:
      NEST_PLUGIN_URL: http://nest:8080/api/plugin/v1
      TZ: Europe/Berlin
    volumes:
      - tracker-data:/data
    networks:
      - nest
      - proxy  # Caddy leitet tracker.mini.shibusa.moe an nest-tracker:8080

volumes:
  tracker-data:

networks:
  nest:
    name: nest_default
    external: true
  proxy:
    name: proxy
    external: true
